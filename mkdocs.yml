site_name: Tutoriel Rust
site_description: Tutoriel Rust complet — 18 chapitres, 3 niveaux, 3 projets fil rouge
site_author: Clifford Laserre
docs_dir: docs

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - tables

plugins:
  - search:
      lang: fr

nav:
  - Accueil: index.md
  - "Niveau 1 — Fondamentaux":
    - "Ch. 1 — Écosystème": cours/01_ecosysteme.md
    - "Ch. 2 — Primitifs et variables": cours/02_fondations.md
    - "Ch. 3 — Flux de contrôle": cours/03_flux_controle.md
    - "Ch. 4 — Ownership & borrowing": cours/04_ownership.md
    - "Ch. 5 — Structs, enums, collections": cours/05_structures_donnees.md
    - "Ch. 6 — Gestion des erreurs": cours/06_gestion_erreurs.md
    - "Ch. 7 — Fonctions, modules, CLI todo": cours/07_fonctions_modules.md
  - "Niveau 2 — Intermédiaire":
    - "Ch. 8 — Structs avancés, newtype": cours/08_structs_enums.md
    - "Ch. 9 — Lifetimes": cours/09_lifetimes.md
    - "Ch. 10 — Traits": cours/10_traits.md
    - "Ch. 11 — Génériques et itérateurs": cours/11_generics_iterators.md
    - "Ch. 12 — Tests et parseur de logs": cours/12_tests_qualite.md
  - "Niveau 3 — Expert":
    - "Ch. 13 — Concurrence sync": cours/13_concurrence_sync.md
    - "Ch. 14 — Async Tokio": cours/14_async_tokio.md
    - "Ch. 15 — Unsafe et FFI": cours/15_unsafe_ffi.md
    - "Ch. 16 — Macros et patterns": cours/16_macros_patterns.md
    - "Ch. 17 — Web avec Axum": cours/17_dev_web_axum.md
    - "Ch. 18 — Packaging et CI": cours/18_packaging.md
  - Annexes:
    - "A — Debug et outils": annexes/A_debug_tooling.md
    - "B — Regex et parsing": annexes/B_regex_parsing.md
    - "C — Bases de données": annexes/C_bases_donnees.md
    - "D — WASM et embarqué": annexes/D_wasm_embarque.md
